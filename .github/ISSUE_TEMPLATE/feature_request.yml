name: 功能建议
description: 提议新的交互、场景、文档或二创体验
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        先说清楚「想解决什么问题」，比直接给实现方案更有帮助。大范围改动建议先开 Issue 聊一聊。
        请勿提交真人照片、私人信件/聊天记录或他人的版权素材。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个建议和什么使用场景有关？
      placeholder: 例如：手机横屏时，底部地点导航容易挡住照片卡上的按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述你希望看到的效果，不必写出完整代码。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选。例如：不改布局，只调整按钮位置。
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 3D 场景与镜头
        - 照片卡 / 庆祝流程
        - 昼夜光影与声音
        - 界面与移动端适配
        - 无障碍
        - 文档与二创流程
        - 其他
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考图、类似项目或示意图都可以（请确认你有权分享）。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认建议中没有附上真人照片、私人信件/聊天记录、定位元数据或他人的版权音频。
          required: true
