name: Bug 报告
description: 报告可以复现的问题：页面报错、交互异常、构建失败等
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈！提交前请先搜索已有 Issue，并确认问题可以在最新版本上复现。
        **不要在 Issue 里附真人照片、私人信件、聊天记录或他人的版权录音。**
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 用自己的话描述现象，越具体越好。
      placeholder: 例如：点击亚庇的「日落亭」标记后，照片卡没有打开，控制台出现报错。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面开始，按顺序写清楚每一步。
      placeholder: |
        1. 打开首页并点「开始假期」
        2. 顶部切换到「亚庇」
        3. 点击场景里的日落亭标记
        4. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 应该打开日落亭的照片卡并显示 1 张照片。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图或录屏也请附上（注意不要包含私人内容）。
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Chrome 140 / Safari 18 / Edge 140 …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS / iPadOS
        - 其他
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行方式
      options:
        - npm run dev（本地开发）
        - npm run preview（本地构建产物）
        - 部署后的线上版本
        - 其他
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js 版本（构建/运行相关问题时填写）
      placeholder: node -v 的输出，例如 v22.12.0
  - type: textarea
    id: logs
    attributes:
      label: 控制台输出或构建日志
      description: 与问题相关的报错片段即可，注意移除本地路径中的个人信息。
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认 Issue 中没有附上真人照片、私人信件/聊天记录、定位元数据或他人的版权音频。
          required: true
